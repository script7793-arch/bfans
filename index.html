<!DOCTYPE html>
<html>
<head>
    <title>bfans</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Courier New", monospace;
        }

        .centered-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            pointer-events: none;
        }

        /* Static effect */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.03),
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px,
                    transparent 3px
                );
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes glitch {
            0%,100% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 1px);
            }
            40% {
                transform: translate(2px, -1px);
            }
            60% {
                transform: translate(-1px, -2px);
            }
            80% {
                transform: translate(1px, 2px);
            }
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.9; }
        }
    </style>
</head>
<body>

<img src="background.png" alt="Background" class="centered-image" />

</body>
</html>
